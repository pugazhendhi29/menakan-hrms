<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 264 430" preserveAspectRatio="xMidYMax slice">
  <!-- Sidebar scene: a Menakan truck on an open road at dusk. Decorative; replace with a photo of the same name/size if preferred. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14283f"/>
      <stop offset=".3" stop-color="#2b3560"/>
      <stop offset=".48" stop-color="#8a3352"/>
      <stop offset=".6" stop-color="#d9484a"/>
      <stop offset=".7" stop-color="#f08c56"/>
    </linearGradient>
    <radialGradient id="sun" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(70 206) scale(120 60)">
      <stop offset="0" stop-color="#ffd8a8" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#ff9a62" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff6b4a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f45"/>
      <stop offset="1" stop-color="#0d1524"/>
    </linearGradient>
    <linearGradient id="trailer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a1f2c"/>
      <stop offset=".7" stop-color="#6e2433"/>
      <stop offset="1" stop-color="#8f2a36"/>
    </linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8323d"/>
      <stop offset="1" stop-color="#5a1822"/>
    </linearGradient>
    <radialGradient id="lamp" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6e0"/>
      <stop offset=".3" stop-color="#ffd27a" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ffb04a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="264" height="430" fill="url(#sky)"/>
  <rect width="264" height="430" fill="url(#sun)"/>
  <!-- distant hills and tree line -->
  <path d="M0 196 C30 186 52 190 78 184 C104 178 126 188 152 182 C182 176 214 186 264 178 V214 H0 Z" fill="#3a2b4a" opacity=".85"/>
  <path d="M0 206 C40 198 70 204 104 200 C140 196 170 204 206 198 C230 195 250 200 264 197 V220 H0 Z" fill="#1f2238"/>
  <!-- road in perspective -->
  <path d="M112 208 H134 L264 330 V430 H-30 Z" fill="url(#road)"/>
  <rect y="330" width="264" height="100" fill="#0d1524" opacity=".55"/>
  <path d="M112 208 L-30 340" stroke="#f3c9a6" stroke-opacity=".35" stroke-width="1.5"/>
  <path d="M134 208 L264 322" stroke="#f3c9a6" stroke-opacity=".35" stroke-width="1.5"/>
  <g stroke="#ffe7c7" stroke-linecap="round" opacity=".8">
    <path d="M123 214 L121 222" stroke-width="1.4"/>
    <path d="M119 234 L116 248" stroke-width="2"/>
    <path d="M112 266 L107 288" stroke-width="3"/>
    <path d="M101 312 L95 340" stroke-width="4"/>
    <path d="M90 364 L83 400" stroke-width="5" opacity=".5"/>
  </g>
  <!-- truck: trailer receding to the horizon, cab facing the viewer -->
  <g>
    <ellipse cx="150" cy="292" rx="92" ry="9" fill="#05080f" opacity=".55"/>
    <path d="M92 220 L170 238 L170 288 L92 252 Z" fill="url(#trailer)"/>
    <path d="M92 220 L170 238" stroke="#ff8a7a" stroke-opacity=".5" stroke-width="1"/>
    <path d="M98 236 L166 254" stroke="#d62828" stroke-width="3" stroke-opacity=".9"/>
    <path d="M170 236 L214 232 L216 288 L170 290 Z" fill="url(#cab)"/>
    <path d="M174 242 L210 239 L211 258 L175 260 Z" fill="#1a2436"/>
    <path d="M176 244 L192 243 L180 258 L176 258 Z" fill="#ffffff" opacity=".12"/>
    <rect x="180" y="266" width="26" height="14" rx="2" fill="#2b1218"/>
    <g stroke="#5f2a33" stroke-width="1.2"><path d="M182 269 H204"/><path d="M182 273 H204"/><path d="M182 277 H204"/></g>
    <circle cx="175" cy="275" r="3" fill="#fff3d6"/>
    <circle cx="211" cy="273" r="3" fill="#fff3d6"/>
    <circle cx="175" cy="275" r="16" fill="url(#lamp)"/>
    <circle cx="211" cy="273" r="16" fill="url(#lamp)"/>
    <rect x="168" y="286" width="50" height="5" rx="2" fill="#151b28"/>
    <g fill="#0b0f18"><ellipse cx="112" cy="262" rx="5" ry="8"/><ellipse cx="128" cy="270" rx="5.5" ry="9"/><ellipse cx="160" cy="285" rx="6" ry="10"/></g>
  </g>
  <!-- light trails -->
  <path d="M0 300 C60 290 120 300 160 296" stroke="#ff5a5a" stroke-opacity=".35" stroke-width="2" fill="none"/>
</svg>
